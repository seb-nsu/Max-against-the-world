; Export-Vorlagen für den Testbuild (03-produktion.md, A7 und A9). Beide setzen das Feature-Tag
; cq_testbuild: Damit fragt das Spiel beim ersten Start nach der Telemetrie-Zustimmung
; (skripte/telemetrie.gd). Export headless:
;   godot --headless --path game --export-release "Linux Testbuild" ../build/linux/couch_quest.x86_64
;   godot --headless --path game --export-release "Windows Testbuild" ../build/windows/couch_quest.exe
; GitHub Actions: Workflow „Testbuild“ (.github/workflows/testbuild.yml).

[preset.0]

name="Linux Testbuild"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features="cq_testbuild"
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*"
export_path="../build/linux/couch_quest.x86_64"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
ssh_remote_deploy/enabled=false

[preset.1]

name="Windows Testbuild"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features="cq_testbuild"
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*"
export_path="../build/windows/couch_quest.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=false
application/product_name="Couch Quest Testbuild"
application/file_description="Couch Quest – Testbuild"
ssh_remote_deploy/enabled=false
