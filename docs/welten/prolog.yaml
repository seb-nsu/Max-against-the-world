abschnitt: prolog
name: Opas Dachboden
skript_praefix: [P0, SYS]    # SYS_ERS_*: Ersatzpool für das ganze Spiel (steht im Prolog-Skript)
sonder_codes: [HINT, ERS, WDH, PLA, INV, ABS]   # PLA: Plauder-Pool; ABS: Gespräch erschöpft; P0_HINT_*: Hilfe-Pfote; ERS: Ersatzpool; WDH: Wiederholungs-Pool fürs Ansehen; INV: Inventar ansehen
sonder_sprecher: [NAR]       # Regie- und Animationszeilen ohne Sprecher
weitere_schalter:             # Hilfsschalter und -werte ohne eigenes Rätsel (05-spielsysteme.md, Speichern)
  - P0_SCHNEE_GESEHEN         # erstes Ansehen des rauschenden Zapp-O-Mat gespielt (0420–0440)
  - P0_PIXEL_WECKVERSUCHE     # Wert: Zahl der Weckversuche vor P1 (Opa kommentiert beim zweiten)
  - P0_DRAHTKLEIDERBUEGEL     # Wert: gerade oder antenne
  - P0_DOSE_OFFEN             # Max hat die Thunfischdose geöffnet (0280); Pixel wacht erst auf, wenn er sie ihm hinhält
  - P0_PIXEL_GEWECKT          # Pixel hat an der offenen Dose gerochen und sie abgelehnt (0285–0366); er will Porzellan
  - P0_TASSE_GEFUELLT         # Thunfisch ist in Opas Teetasse (0072)
  - P0_NAPF_STUFE             # Wert: Hinweisstufe für den zweiten Teil von P1 (Opa, 1520–1528)
  - P0_NAPF_ZEIT              # Wert: Spielzeit beim letzten Stufenwechsel

raeume:
  - id: wohnzimmer
    name: Wohnzimmer
    skript_code: [WOHN]
    groesse: 640x360
    ausgaenge: [treppenhaus]
    erreichbar_ab: start
    musik: gegenwart
    atmo: uhr_ticken
    zustaende: [Nachmittag]          # Abend und Geburtstag gehören zu Welt 3, Welt 4 und Finale

  - id: treppenhaus
    name: Treppenhaus
    skript_code: [TREP]
    groesse: 640x360
    ausgaenge: [wohnzimmer, dachboden]
    erreichbar_ab: start
    musik: gegenwart
    atmo: uhr_ticken
    zustaende: [Nachmittag]

  - id: dachboden
    name: Dachboden
    skript_code: [DACH]
    groesse: 640x360
    ausgaenge: [treppenhaus]         # Rückweg durch die Bodenluke bis P1 (Dose und Teetasse liegen unten); danach verweigert Max (P0_DACH_MAX_1000)
    erreichbar_ab: start
    musik: gegenwart
    atmo: uhr_ticken
    zustaende: [Nachmittag]

figuren:
  - id: max
    name: Max
    kuerzel: MAX
    raum: [wohnzimmer, treppenhaus, dachboden]
    groesse_px: 189
    spielbar: true

  - id: pixel
    name: Pixel
    kuerzel: PIX
    raum: dachboden
    groesse_px: 61                   # sitzend; schlafend siehe grafik/02-prolog-und-finale.md
    spielbar: false                  # Figurenwechsel erst ab Welt 1

  - id: opa
    name: Opa                        # im Wohnzimmer als „Opa (von oben)“
    kuerzel: OPA
    raum: dachboden
    groesse_px: 201
    spielbar: false


gegenstaende:
  - id: thunfischdose
    name: Thunfischdose
    herkunft: treppenhaus            # steckt in Opas Mantel „man weiß ja nie“
    zustaende: [zu, offen, leer]     # nach P1 leer; reist leer weiter
    verwendet_in: [P1]               # danach Welt 1 R1c, Welt 2 Wunderding
    reist_mit: true                  # Pflichtfach
    nahansicht: false

  - id: dosenoeffner
    name: Dosenöffner
    herkunft: dachboden              # hängt an der Werkbank
    zustaende: [normal]
    verwendet_in: [P1]
    reist_mit: true                  # bleibt nach dem Prolog oben, ab Rückkehr 1 als Wahlfach wählbar
    nahansicht: false

  - id: teetasse
    name: Teetasse
    herkunft: wohnzimmer             # Opas Teetasse vom Couchtisch, mit kaltem Tee
    zustaende: [kalt, gefuellt]      # gefuellt: Thunfisch aus der Dose ist drin; bleibt nach P1 als Pixels Napf auf der Werkbank
    verwendet_in: [P1]
    reist_mit: false
    nahansicht: false

  - id: drahtkleiderbuegel
    name: Drahtkleiderbügel          # gebogen heißt er im Inventar „Antenne“
    herkunft: dachboden              # Kleiderschrank
    zustaende: [gerade, antenne]
    verwendet_in: [P2]
    reist_mit: false                 # bleibt als Antenne auf dem Zapp-O-Mat
    nahansicht: false

  - id: reisetasche
    name: Opas Reisetasche
    herkunft: P3
    zustaende: [normal]              # Packen als eigener Bildschirm (Grafik, Benutzeroberfläche)
    verwendet_in: []
    reist_mit: true
    nahansicht: false

  - id: notizbuch
    name: Notizbuch
    herkunft: P3                     # liegt im Pflichtfach der Reisetasche
    zustaende: [normal]
    verwendet_in: []
    reist_mit: true
    nahansicht: false                # eigener Bildschirm Notizbuch

  - id: opas_zettel
    name: Opas Zettel
    herkunft: P3
    zustaende: [normal]
    verwendet_in: []                 # wird erst in Welt 1 gelesen
    reist_mit: true
    nahansicht: true                 # eine der zwei Prolog-Nahansichten (mit dem Kalender); gelesen in Welt 1, gezählt nur hier

nahansichten:                        # Nahansichten, die kein Gegenstand sind
  - id: kalender
    name: Kalender
    raum: dachboden

raetsel:
  - id: P1
    name: Der schlafende Kater
    raum: dachboden
    benoetigt: [thunfischdose, dosenoeffner, teetasse]
    ergibt: []                       # Pixel wach, Hilfe-Pfote aktiv, Zapp-O-Mat an
    schalter: [P0_P1_GELOEST]
    optional: false

  - id: P2
    name: Nur Rauschen
    raum: dachboden
    benoetigt: [P1, drahtkleiderbuegel]
    ergibt: []
    schalter: [P0_P2_GELOEST]
    optional: false

  - id: P3
    name: Der richtige Kanal
    raum: dachboden
    benoetigt: [P2]                  # Kanalnummer aus der Nahansicht Kalender
    ergibt: [reisetasche, notizbuch, opas_zettel]
    schalter: [P0_P3_GELOEST]
    optional: false
