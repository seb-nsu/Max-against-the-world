abschnitt: welt-4
name: Kanal 999
skript_praefix: W4

# Ausgänge: Umschalten gilt als Weg zwischen den Haupträumen der Sender
# (gluecksrad, sitcom_kueche, savanne, friedhof, kapitolis, werbespot_set, empfang).
# Werbespot-Set und Empfang erreicht Max per Programmzeitschrift bzw. Sendersuchlauf,
# Mitternachts-TV zeigt außerhalb von Mitternacht die Pausentafel. Im Studio geht Umschalten nicht.

raeume:
  - id: testbild
    name: Testbild
    skript_code: [TEST]
    groesse: 480x270
    ausgaenge: [gluecksrad]            # nach R1 wischt das Bild ins Studio
    erreichbar_ab: start
    musik: w4_testbild
    zustaende: [Balken durcheinander, Balken geordnet, Graustufen]
  - id: rauschen
    name: Rauschen zwischen den Sendern
    skript_code: [RAU]
    groesse: 480x270
    ausgaenge: [gluecksrad, sitcom_kueche, savanne, friedhof, kapitolis, empfang]   # nur Pixel, kriecht in die Sender
    erreichbar_ab: R1
    musik: w4_testbild
  - id: gluecksrad
    name: Glücksrad-Studio
    skript_code: [GLUE, BONU]
    groesse: 480x270
    ausgaenge: [testbild, sitcom_kueche, savanne, friedhof, kapitolis, werbespot_set, empfang]   # Umschalten
    erreichbar_ab: R1
    musik: w4_gluecksrad
  - id: sitcom_kueche
    name: Sitcom-Küche
    skript_code: [SIT]
    groesse: 480x270
    ausgaenge: [gluecksrad, savanne, friedhof, kapitolis, werbespot_set, empfang]   # Umschalten
    erreichbar_ab: R2
    musik: w4_sitcom
    zustaende: [Keksdose ganz, Scherben am Boden, Küchentür weg]
  - id: savanne
    name: Savanne
    skript_code: [SAV, VERH]
    groesse: 960x270
    ausgaenge: [gluecksrad, sitcom_kueche, friedhof, kapitolis, werbespot_set, empfang]   # Umschalten
    erreichbar_ab: R2
    musik: w4_savanne
  - id: friedhof
    name: Musikvideo-Friedhof
    skript_code: [FRIE]
    groesse: 480x270
    ausgaenge: [spukhaus_keller, gluecksrad, sitcom_kueche, savanne, kapitolis, werbespot_set, empfang]   # Keller zu Fuß nach R5, sonst Umschalten
    erreichbar_ab: R2                  # nur um Mitternacht über die Programmzeitschrift, sonst Pausentafel
    musik: w4_mitternacht    # Musikvideo mit Rhythmus-Minispiel
    zustaende: [Gräber zu mit Händen, Gräber offen]
  - id: spukhaus_keller
    name: Spukhaus, Keller
    skript_code: [KELL]
    groesse: 480x270
    ausgaenge: [friedhof, spukhaus_halle]   # Grabplatte zum Friedhof; Sitcom-Tür nach oben ab R6
    erreichbar_ab: R5
    musik: w4_spukhaus
    zustaende: [Tür zu, Sitcom-Tür eingesetzt]
  - id: spukhaus_halle
    name: Spukhaus, Halle
    skript_code: [HALL]
    groesse: 480x270
    ausgaenge: [spukhaus_keller]
    erreichbar_ab: R6
    musik: w4_spukhaus
    zustaende: [Lichterkette aus, Lichterkette blinkt]
  - id: kapitolis
    name: Kapitolis
    skript_code: [KAPI]
    groesse: 480x270
    ausgaenge: [fondue_fabrik, gluecksrad, sitcom_kueche, savanne, friedhof, werbespot_set, empfang]   # Fabrik zu Fuß, sonst Umschalten
    erreichbar_ab: R2
    musik: w4_comic
    zustaende: [Amboss auf der Straße, Amboss weg]
  - id: fondue_fabrik
    name: Fondue-Fabrik
    skript_code: [FABR]
    groesse: 480x270
    ausgaenge: [kapitolis]
    erreichbar_ab: R2
    musik: w4_comic
    zustaende: [Bottich zu, Bottich offen]   # Suchscheinwerfer aus bzw. an
  - id: werbespot_set
    name: Werbespot-Set
    skript_code: [WERB]
    groesse: 480x270
    ausgaenge: [gluecksrad, sitcom_kueche, savanne, friedhof, kapitolis, empfang]   # hinein über die Programmzeitschrift
    erreichbar_ab: R2
    musik: lied_werbepause   # Dr. Werbepauses Jingle läuft im Spot, bis Stumm ihn abbricht (R11b)
    zustaende: [Couch-Magnet auf dem Podest, Podest leer]
  - id: empfang
    name: Empfang
    skript_code: [EMPF]
    groesse: 480x270
    ausgaenge: [kellerarchiv, zappmanns_studio, gluecksrad, sitcom_kueche, savanne, friedhof, kapitolis, werbespot_set]   # Aufzug nur hinauf (R12); hinaus per Umschalten
    erreichbar_ab: R11                 # Sendersuchlauf, danach Kanal 999 in der Programmzeitschrift
    musik: w4_zentrale
  - id: kellerarchiv
    name: Kellerarchiv
    skript_code: [ARCH]
    groesse: 480x270
    ausgaenge: [empfang]               # Servicetür
    erreichbar_ab: R11
    musik: w4_zentrale
  - id: zappmanns_studio
    name: Zappmanns Studio
    skript_code: [STUD]
    groesse: 480x270
    ausgaenge: [empfang]               # Aufzug; zurück erst nach R13, Umschalten gesperrt
    erreichbar_ab: R12
    musik: w4_zappmann
    zustaende: [Quote hoch, Quote eingebrochen]
# Weitere Bilder ohne begehbaren Raum (Grafik Welt 4): Zappmanns erste Kindersendung (Bild-in-Bild in R13),
# Max auf der Couch (Albtraum in R13), Opa vor flackernden Lampen (Prolog-Wohnzimmer, R7), Pausentafel Mitternachts-TV.

sonder_codes: [FERN, TAST, PIXM, ZURF, HINT, INV, ABS]   # INV Inventar ansehen, ABS Gespräch erschöpft, Fernbedienung/Programmzeitschrift, Tasten quer, Pixel auf Mensch, Zurufe, Hinweise
sonder_sprecher: [NAR]                          # Szenen- und Tonzeilen ohne Sprecher

