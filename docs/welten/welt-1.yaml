abschnitt: welt-1
name: Schwurbelstein
skript_praefix: W1

# Szenen-Codes ohne eigenen Raum: WECH (Figurenwechsel, gilt überall), HINT (Hilfe-Pfote)
sonder_codes: [WECH, HINT, INV, ABS]
# Sprecher ohne Figur: NAR (Erzähl- und Szenentext, Sprecher „–“ im Skript)
sonder_sprecher: [NAR]
# Hilfsschalter und -werte ohne eigenes Rätsel (05-spielsysteme.md, Speichern)
weitere_schalter:
  - W1_WECHSEL_FREI          # Figurenwechsel freigeschaltet (erstes Betreten der Taverne)
  - W1_TAVERNE_WECHSEL       # Wert: erste Wechsel in der Taverne gespielt (TAV 0080, 0090)
  - W1_ZIEGE_FOLGT           # Schmiede-Ziege folgt Max (SCHM 0280), bis Rätsel 4
  - W1_XXL_GELIEFERT         # XXL-Ziege geliefert (DORF 0920 bis 0980), folgt bis Rätsel 4
  - W1_PIXEL_IM_FELL         # Pixel trägt den Ziegenfell-Vorleger (BRUE 0410), bis Rätsel 4
  - W1_R4A_REIHE             # Wert: Ziegen in richtiger Reihenfolge auf der Brücke (0 bis 3)
  - W1_SATZUNG_VORGELESEN    # Max hat die Sätze vorgelesen (BRUE 0650)
  - W1_R4B_ZIE_VERSUCHE      # Wert: Pixels Übersetzungsversuche bei der Schmiede-Ziege
  - W1_R4B_XXL_VERSUCHE      # Wert: Pixels Übersetzungsversuche bei der XXL-Ziege
  - W1_EIMER                 # Wert: leer oder mit_wasser

raeume:
  - id: dorfplatz
    name: Dorfplatz Unterbrösel
    skript_code: [ANK, DORF]   # ANK = Ankunftsszene auf dem Dorfplatz
    groesse: 640x180
    ausgaenge: [taverne, schmiede, zauberstabladen, klassenzimmer, trollbruecke, luftschloss]
    erreichbar_ab: start
    musik: w1_dorf
    zustaende: [vor_R8, nach_R8]   # Bohnenranke als eigenes Sprite

  - id: taverne
    name: Taverne „Zum tänzelnden Pony-Express“
    skript_code: [TAV]
    groesse: 320x180
    ausgaenge: [dorfplatz]
    erreichbar_ab: start
    musik: w1_taverne

  - id: schmiede
    name: Schmiede
    skript_code: [SCHM]
    groesse: 320x180
    ausgaenge: [dorfplatz]
    erreichbar_ab: start
    musik: w1_dorf

  - id: zauberstabladen
    name: Zauberstab-Laden
    skript_code: [STAB]
    groesse: 320x180
    ausgaenge: [dorfplatz]
    erreichbar_ab: start
    musik: w1_dorf

  - id: klassenzimmer
    name: Hoggelwarz, Klassenzimmer
    skript_code: [HOGG]
    groesse: 320x180
    ausgaenge: [dorfplatz]
    erreichbar_ab: start       # Prüfung erst mit Kochlöffel-Zauberstab (R2)
    musik: w1_schule

  - id: trollbruecke
    name: Troll-Brücke
    skript_code: [BRUE]
    groesse: 320x180
    ausgaenge: [dorfplatz, zauberwald, wasserschloss]
    erreichbar_ab: start
    musik: w1_dorf

  - id: wasserschloss
    name: Wasserschloss
    skript_code: [WASS]
    groesse: 320x180
    ausgaenge: [trollbruecke]
    erreichbar_ab: R4          # Gag-Szene ohne Rätsel
    musik: w1_dorf

  - id: zauberwald
    name: Zauberwald
    skript_code: [WALD]
    groesse: 320x180
    ausgaenge: [trollbruecke, bergwerk]
    erreichbar_ab: R4
    musik: w1_wald
    zustaende: [niesrosen_zu, niesrosen_offen]   # Niesrosen als eigenes Sprite

  - id: luftschloss
    name: Luftschloss
    skript_code: [LUFT]
    groesse: 320x180
    ausgaenge: [dorfplatz]     # über die Bohnenranke
    erreichbar_ab: R8
    musik: w1_luftschloss

  - id: bergwerk
    name: Goblin-Bergwerk
    skript_code: [BERG]
    groesse: 320x180
    ausgaenge: [zauberwald, turmkeller]
    erreichbar_ab: R4          # Streikposten frei betretbar; Rune-Tür erst nach R10
    musik: w1_bergwerk
    zustaende: [rune_tuer_zu, rune_tuer_offen]

  - id: turmkeller
    name: Dunkler Turm, Keller
    skript_code: [TURM]
    groesse: 320x180
    ausgaenge: [bergwerk, abstellkammer_1, abstellkammern]   # Kammertür und Wendeltreppe erst nach R11b
    erreichbar_ab: R10
    musik: w1_turm
    zustaende: [vor_R11b, nach_R11b]   # Kammertür offen mit Besen / Tür zu ohne Besen

  - id: abstellkammer_1
    name: Abstellkammer 1
    skript_code: []            # Zeilen W1_TURM_*_0300 bis 0330 laufen unter dem Code TURM des Turmkellers
    groesse: 320x180
    ausgaenge: [turmkeller]
    erreichbar_ab: R11b        # Ansehen-Raum ohne Rätsel
    musik: w1_turm

  - id: abstellkammern
    name: Smaugis Abstellkammern
    skript_code: [SMAU]        # oberste Kammer, Ebene 6; Kammern 2 bis 5 sind kein Raum
    groesse: 320x180
    ausgaenge: [turmkeller, thronsaal]   # Geheimtür: offen nach R11a, durchgehen nach R12
    erreichbar_ab: R11b
    musik: w1_turm
    zustaende: [voll, aufgeraeumt]       # aufgeräumt nach R12

  - id: thronsaal
    name: Thronsaal
    skript_code: [THRO]
    groesse: 320x180
    ausgaenge: [abstellkammern]
    erreichbar_ab: R12         # zusätzlich R11a (Geheimtür)
    musik: w1_turm

