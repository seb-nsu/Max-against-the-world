abschnitt: welt-2
name: Antikodonien
skript_praefix: W2

# Szenen-Codes ohne eigenen Raum: Hinweise, Inventar, Zurufe, Fahrt auf der Zeitfähre (Flusskarte)
sonder_codes: [HINT, INV, ABS, ZURU, FAHR]
sonder_sprecher: [NAR]   # Erzähltext zu Animationen, keine Figur

# Gespeicherte Werte (05-spielsysteme, Speichern: Welt 2). Das Alter von Grabstein und Krügen
# folgt allein aus dem Steg, an dem Max gerade ist (Tabelle „Zeitrechnung der Fähre“ in raetsel/welt-2.md).
werte:
  W2_FAEHRE_STEG: [nil_delta, faehrsteg_olympia, hafen_syrakus]   # Startwert nil_delta
  W2_FEIGE_ZUSTAND: [setzling, feigenbaum, feigenkern]           # jede Fahrt flussabwärts: Baum, flussaufwärts: Kern

# Schalter und Werte der Rätsellogik (game/skripte/welt_2.gd), die keinem Rätselschritt gehören
weitere_schalter:
  - W2_WECHSEL_FREI          # Figurenwechsel frei (Ankunft im Nil-Delta)
  - W2_FAHRTEN               # Wert: Zahl der Fährfahrten (Opas Papyrus nach der ersten)
  - W2_SOBEK_FOLGT           # Sobek kriecht Pixel hinterher (Gefolge im Götter-Duell), bis 2b
  - W2_DUELL                 # Götter-Duell angenommen (DUEL 0080)
  - W2_DUELL_OPFER           # Opfergabe gezählt (Thunfischdose)
  - W2_DUELL_GEFOLGE         # Gefolge gezählt (Sobek)
  - W2_DUELL_WUNDER          # Wunder gezählt (Kaugummi-Sonne oder Brennspiegel)
  - W2_AUDIENZ               # Audienz bei Ramses gespielt (2a und 2b gelöst)
  - W2_HERMES_IM_BUERO       # Hermes steht im Startbüro (nach dem ersten Beamten-Gespräch)
  - W2_RUNDSCHREIBEN         # Wert: mit Kugelschreiber, mit Tinte oder gefunden (3a)
  - W2_FLADEN                # Wert: Stufe des Fladens (mit Datteln, roh, mit Kruste)
  - W2_SANDALEN_GEOELT       # Olivenöl auf den Sandalen (Lauf an Tag 1, Öl angebrochen)
  - W2_KRONE_AUF_WAAGE       # Krone liegt auf der Waage (KRON 0040)
  - W2_GETAUCHT              # Wert: zuletzt in die Wanne getaucht (krone, goldbarren)
  - W2_KRONE_GEMESSEN        # Krone: zwei Striche
  - W2_BARREN_GEMESSEN       # Barren: ein Strich
  - W2_TAG1_LAEUFT           # Wettkampftag 1 läuft (Hebel-Minispiel)
  - W2_LAUF_GEOELT           # Lauf mit geölten Sandalen (Bestleistung, gesetzt nach R12)
  - W2_KORB                  # Wert: Gegenstände im Korb des Wurfhebels
  - W2_HEBEL_FEHLER          # Wert: Fehlversuche am Hebel (großzügige Wertung ab 2)
  - W2_DISKUS_ERSATZ         # Rätsel 7 mit Ersatz gelöst (DISK 0340)
  - W2_BAUSTEINE             # Wert: gefundene Rätsel-Bausteine der Sphinx
  - W2_KONTER                # Wert: gesammelte Konter 1 bis 7
  - W2_CICERO_FORDERUNG      # Cicero hat das Grab verlangt (AGOR 0260)
  - W2_WUNDERDINGE_BEHALTEN  # Handy, Kaugummi und Kugelschreiber bis zur Parade behalten
  - W2_GESCHAFFT             # Welt 2 abgeschlossen (PARA 0360)

raeume:
  - id: nil_delta
    name: Nil-Delta mit Fährsteg
    skript_code: [NIL]
    groesse: 640x360
    ausgaenge: [thronsaal_ramses, sphinx, faehrsteg_olympia, hafen_syrakus]   # zwei Fußwege, Fähre (Flusskarte) zu beiden Anlegestellen
    erreichbar_ab: start
    musik: w2_aegypten
    # Anlegestelle Ägypten: Grabstein 0 Jahre (frisch), Krug aus dem Palast Traubensaft, Essigkrug Traubensaft
  - id: thronsaal_ramses
    name: Thronsaal
    skript_code: [THRO, HIER, DUEL, AUDI]
    groesse: 640x360
    ausgaenge: [nil_delta, palastkueche]
    erreichbar_ab: start
    musik: w2_aegypten
  - id: palastkueche
    name: Palastküche
    skript_code: [KUCH]
    groesse: 640x360
    ausgaenge: [thronsaal_ramses]
    erreichbar_ab: start
    musik: w2_aegypten
  - id: sphinx
    name: Sphinx
    skript_code: [SPHX]
    groesse: 640x360
    ausgaenge: [nil_delta]
    erreichbar_ab: start
    musik: w2_aegypten
    zustaende: [mit Nase, ohne Nase]          # ohne Nase ab dem Finaltag (Probewürfe)
  - id: faehrsteg_olympia
    name: Fährsteg Olympia
    skript_code: [STOL]
    groesse: 640x360
    ausgaenge: [agora, nil_delta, hafen_syrakus]   # Steinweg, Fähre
    erreichbar_ab: R1
    musik: w2_olympia
    # Anlegestelle Olympia: Grabstein 112 Jahre (grau), Krug aus dem Palast Essig, Essigkrug Wein
  - id: agora
    name: Agora
    skript_code: [AGOR, SAND]
    groesse: 1280x360
    ausgaenge: [faehrsteg_olympia, stadion, startbuero]
    erreichbar_ab: R1
    musik: w2_olympia
    zustaende: [vor Tag 1, Sandale auf der Säule, nach dem Finaltag]   # Sandale bis R6a; ab Finaltag Statue ohne Arme
  - id: startbuero
    name: Startbüro
    skript_code: [BUER]
    groesse: 640x360
    ausgaenge: [agora]
    erreichbar_ab: R1
    musik: w2_olympia
  - id: stadion
    name: Stadion
    skript_code: [STAD, TAG1, HEBL, DISK, FINA, RING, PARA]   # DISK spielt auch auf der Agora und bei der Sphinx
    groesse: 640x360
    ausgaenge: [agora]
    erreichbar_ab: R1
    musik: w2_olympia
    zustaende: [normal, Parade]                # Parade ab Ende des Finaltags, Glockenturm schief
  - id: hafen_syrakus
    name: Hafen Syrakus
    skript_code: [HAFS]
    groesse: 640x360
    ausgaenge: [werkstatt, grabhuegel, nil_delta, faehrsteg_olympia]   # Gasse, Pfad, Fähre
    erreichbar_ab: R1
    musik: w2_syrakus
    # Anlegestelle Syrakus: Grabstein 137 Jahre (verwittert), Krug aus dem Palast Essig, Essigkrug Essig
  - id: werkstatt
    name: Archimedes' Werkstatt
    skript_code: [WERK, KRON, TRAI]
    groesse: 640x360
    ausgaenge: [hafen_syrakus]
    erreichbar_ab: R1
    musik: w2_syrakus
  - id: grabhuegel
    name: Grabhügel Syrakus
    skript_code: [GRAB]                        # W2_GRAB 0010–0090 spielen beim Steinmetz im Nil-Delta
    groesse: 640x360
    ausgaenge: [hafen_syrakus]
    erreichbar_ab: R1
    musik: w2_syrakus
    zustaende: [leer, mit verwittertem Grabstein]

