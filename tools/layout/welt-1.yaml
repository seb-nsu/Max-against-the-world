# Platzhalter-Layout Welt 1 für die Graubox (tools/godot_raeume.py), Vertical Slice.
#
# Nur Startwerte: Der Godot-Bau (addons/couch_quest_bau) setzt Rechtecke, Laufbereich und
# Positionen ausschließlich beim ersten Anlegen eines Objekts. Danach gehören Umrisse und
# Positionen der Szene in Godot (03-produktion.md, Arbeitsteilung). Lage nach
# grafik/welt-1.md (Motiv-Spalte: links, Mitte, rechts; Bodenband im unteren Drittel).
#
# Koordinaten in Spielpixeln, Rechteck = [x, y, breite, hoehe], gehe = Punkt, zu dem die Figur
# vor der Aktion läuft. Schlüssel der Hotspots = Objekt-ID aus dem Auslöser des Skripts.
#
# Sonderschlüssel (beginnen mit _):
#   _ausbau   Rätselschritte, die in der Graubox gebaut sind (Stufe 2: Rätsel 1 bis 4). Alle
#             anderen bleiben gesperrt: Pfote, Notizbuch und Ausgänge verweisen nicht auf sie.
#   _alias    Name im Skript → Gegenstand-ID, optional mit Zustand (id@zustand)
#   _tiere    Figuren, mit denen nur Pixel reden kann (Max: W1_WECH_MAX_0100)
#   _figuren  Figuren ohne festen Platz, die erst im Spiel dazukommen (Ziegen, Lieferung)
# Je Raum:
#   alias     Name im Skript → Objekt-ID in diesem Raum
#   ohne      Objekte, deren Zeilen zu noch nicht gebauten Rätseln gehören (werden übergangen)
#   ausgaenge.<ziel>.gesperrt   Zeile beim Klick, solange das Ziel nicht erreichbar ist
#   ausgaenge.<ziel>.versteckt  Ausgang unsichtbar, solange das Ziel nicht erreichbar ist

_ausbau: [R1, R1a, R1b, R1c, R2, R3, R4, R4a, R4b, R4c, R5, R6, R6a, R6b, R7, R8, R9, R10, R10a, R10b, R11, R11a, R11b, R12, R13]
_alias:
  kochloeffel_zauberstab: kochloeffel@zauberstab
  socke: socke
  sortierende_socke: socke
  ziegenmilch: krug@mit_ziegenmilch
  vorleger: ziegenfell_vorleger
  zauberbohne: zauberbohne
  eimer_mit_wasser: eimer@mit_wasser
  leerer_eimer: eimer@leer
  eimer_leer: eimer@leer
  fischoel: flasche
  flaeschchen: flasche
  socke_voller_pollen: socke@voller_pollen
  schwerter: schwerter_buendel
  fackeln: fackel_buendel
_tiere: [minka, huhn, schmiede_ziege, xxl_ziege, schwan]
_ohne_gespraech: [moderwort]   # Reden mit Moderwort regelt room_thronsaal.gd (R13)
_figuren: [schmiede_ziege, xxl_ziege, rotkaeppchen, zeldina, grimmzahn, toadi, waldemar, humbert]

