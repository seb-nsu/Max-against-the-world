# Platzhalter-Layout Prolog für die Graubox (tools/godot_raeume.py).
#
# Nur Startwerte: Der Godot-Bau (addons/couch_quest_bau) setzt Rechtecke, Laufbereich und
# Positionen ausschließlich beim ersten Anlegen eines Objekts. Danach gehören Umrisse und
# Positionen der Szene in Godot und werden dort von Hand nachgezogen (03-produktion.md,
# Arbeitsteilung). Grundlage für die Lage: grafik/02-prolog-und-finale.md (Motiv-Spalte).
#
# Koordinaten in Spielpixeln (tools/aufloesung.py), Rechteck = [x, y, breite, hoehe],
# gehe = Punkt, zu dem die Figur vor der Aktion läuft.
# tiefe = optional, z. B. 0.85: Figuren am oberen Rand des Laufbereichs auf 85 Prozent verkleinert
# (Raumansicht mit leichter Tiefe; erst eintragen, wenn der echte Hintergrund drin ist).
# Schlüssel der Hotspots = Objekt-ID, die godot_raeume.py aus dem Auslöser des Skripts
# ableitet („Ansehen: Ausgestopfter Fisch“ → ausgestopfter_fisch).

