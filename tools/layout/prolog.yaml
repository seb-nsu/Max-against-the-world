  # Echter Hintergrund (12. November 2026, Neufassung im Stil des Dachbodens, 32 Farben).
  # Koordinaten aus dem Bild; übernommen mit --cq-layout=wohnzimmer. Hinter dem Couchtisch und hinter
  # dem Sofa ist kein Laufbereich (beide gehören zum Bild).
  hintergrund: res://grafik/hintergruende/w0_bg_wohnzimmer_v03.png
  tiefe: 0.85
  laufbereich: [[0, 357], [0, 320], [400, 314], [410, 284], [550, 282], [560, 300], [635, 300], [635, 357]]
  marker:
    start: [187, 330]              # Max vor dem Sofa (Szene 1)
    von_treppenhaus: [590, 310]    # durch die Tür rechts
  hotspots:
    sofa: {rect: [40, 167, 198, 145], gehe: [150, 330]}
    leerer_platz_auf_dem_couchtisch: {rect: [340, 238, 34, 14], gehe: [360, 318]}
    fernseher: {rect: [440, 142, 105, 135], gehe: [490, 292]}
    familienfoto: {rect: [237, 75, 95, 100], gehe: [290, 318]}
    # Weitere Dinge (Gag-Überarbeitung, 10. November 2026)
    schrank: {rect: [10, 80, 115, 90], gehe: [70, 330]}
    stehlampe: {rect: [177, 95, 48, 105], gehe: [200, 322]}
    zeitung: {rect: [270, 220, 75, 28], gehe: [310, 318]}
    # Finale (skripte/finale.gd): nur im Finale sichtbar; versteckt = nicht ins Platzhalterbild malen (verriete den Kuchen)
    kuchen: {rect: [318, 192, 43, 40], gehe: [340, 318], name: Kuchen, versteckt: true}
    girlande: {rect: [133, 11, 373, 27], gehe: [320, 320], name: Girlande, versteckt: true}
    geschenke: {rect: [395, 268, 35, 29], gehe: [420, 300], name: Geschenke, versteckt: true}
  props:
    teetasse: {rect: [300, 227, 18, 13], gehe: [310, 318]}   # Opas Teetasse auf dem Couchtisch, zum Mitnehmen
  ausgaenge:
    treppenhaus: {rect: [558, 42, 77, 258], gehe: [600, 305]}

treppenhaus:
  farbe: "#584536"
  # Echter Hintergrund (12. November 2026, Neufassung im Stil des Dachbodens, 32 Farben). Koordinaten
  # aus dem Bild; übernommen mit --cq-layout=treppenhaus. Laufbereich: Flur vorne plus schmales Band
  # über die Stufen nach oben rechts.
  hintergrund: res://grafik/hintergruende/w0_bg_treppenhaus_v02.png
  tiefe: 0.85
  # Die Treppe liegt an der Rückwand: oberhalb der Flur-Hinterkante (y 282) bleibt die Größe bei 85 Prozent,
  # sonst schrumpfte Max beim Hochsteigen (Aseprite-Durchgang, 14. November 2026)
  tiefe_oben_y: 282
  # Vordere Oberkante jeder Trittfläche [x, y], von unten nach oben: Füße stehen auf den Stufen, beim
  # Übertritt hebt sich die Figur kurz auf die nächste Stufe (CQRaum.stufen_anwenden)
  stufen: [[255, 282], [281, 253], [310, 235], [339, 210], [373, 192], [403, 171], [431, 151], [458, 130], [490, 110], [519, 89], [547, 68], [575, 47], [603, 44]]   # Oberkanten der Trittbretter, pixelgenau nachgemessen
  # Geländer (Handlauf, Stäbe, Antrittspfosten) aus dem Bild geschnitten: wer auf der Treppe steht, geht dahinter
  vordergrund:
    gelaender: {bild: res://grafik/props/treppengelaender.png, rect: [246, 0, 349, 299], baseline: 283}
  laufbereich: [[12, 357], [12, 290], [40, 282], [255, 282], [285, 250], [420, 158], [540, 70], [585, 44], [605, 44], [605, 54], [545, 80], [425, 168], [262, 282], [340, 300], [400, 345], [400, 357]]   # über die Treppe nur ein schmales Band auf den Stufenkanten; es beginnt unten an der ersten Stufe, auch von rechts (vorher übersprang Max von der Dose aus die ersten Stufen, 14. November 2026)
  marker:
    start: [173, 310]
    von_wohnzimmer: [55, 310]      # aus der Tür links
    von_dachboden: [565, 60]       # oben auf der Treppe unter der Luke
  hotspots:
    hut_am_haken: {rect: [170, 122, 25, 30], gehe: [182, 300]}   # Hut ist ins Bild gemalt
    regenschirm: {rect: [192, 127, 18, 90], gehe: [200, 300]}
    maentel: {rect: [110, 127, 68, 93], gehe: [150, 300], name: Mäntel}
    deckenlampe: {rect: [200, 10, 45, 80], gehe: [222, 300]}
    kisten: {rect: [405, 195, 215, 150], gehe: [380, 330]}   # Kisten unter der Treppe
    fenster: {rect: [290, 72, 60, 78], gehe: [320, 290]}
    treppe: {rect: [350, 45, 250, 150], gehe: [270, 280]}   # rechts vom Fenster und über den Kisten, sonst verdeckt sie beide
  props:
    thunfischdose: {rect: [424, 239, 16, 13], gehe: [380, 330]}   # guckt aus dem offenen Karton unter der Treppe
  ausgaenge:
    wohnzimmer: {rect: [10, 55, 65, 245], gehe: [45, 305]}
    dachboden: {rect: [395, 0, 230, 45], gehe: [592, 50]}

