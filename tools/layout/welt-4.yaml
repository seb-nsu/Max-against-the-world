# Platzhalter-Layout Welt 4 (Kanal 999) für die Graubox (tools/godot_raeume.py).
#
# Nur Startwerte: Der Godot-Bau (addons/couch_quest_bau) setzt Rechtecke, Laufbereich und
# Positionen ausschließlich beim ersten Anlegen eines Objekts. Danach gehören Umrisse und
# Positionen der Szene in Godot (03-produktion.md, Arbeitsteilung). Die Hotspots liegen hier
# nur im Raster nebeneinander; die echte Lage kommt mit den Hintergründen (grafik/welt-4.md).
#
# Sonderschlüssel wie in welt-1.yaml; dazu je Raum:
#   wechsel   Sender, die nur Umschalten verbindet (Taste Umschalten an der Billig-Fernbedienung,
#             Programmzeitschrift; kein eigener Ausgang, skripte/welt_4.gd)
# und global:
#   _startet       Optionen, deren Folgezeilen die Rätsel-Logik spielt (Bonusrunde)
#   _antwort_ende  letzte Antwort einer Option; was folgt, gehört zum Rätsel (Beweis für den Agenten)
_startet: [W4_BONU_MAX_0010]
_antwort_ende: [W4_HALL_AGE_0600]
_alias: {laken_im_keller: bettlaken, laken: bettlaken}
_figur_alias: {mutter: sitcom_mutter, vater: sitcom_vater, sohn: sitcom_sohn, gerd: gerd_glueck, agent: fbi_agent, siegfried: super_siegfried, wilma: wonder_wilma, sitcom_vater_im_keller: sitcom_vater}

