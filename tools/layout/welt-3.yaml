# Platzhalter-Layout Welt 3 (Neo-Neustadt 2099) für die Graubox (tools/godot_raeume.py).
#
# Nur Startwerte: Der Godot-Bau (addons/couch_quest_bau) setzt Rechtecke, Laufbereich und
# Positionen ausschließlich beim ersten Anlegen eines Objekts. Danach gehören Umrisse und
# Positionen der Szene in Godot (03-produktion.md, Arbeitsteilung). Die Hotspots liegen hier
# nur im Raster nebeneinander; die echte Lage kommt mit den Hintergründen (grafik/welt-3.md).
#
# Koordinaten in Spielpixeln, Rechteck = [x, y, breite, hoehe], gehe = Punkt, zu dem die Figur
# vor der Aktion läuft. Sonderschlüssel wie in welt-1.yaml; dazu je Raum:
#   wechsel   Ziele, die nur ein Ebenenwechsel verbindet (Wecker, Terminal, Kapsel,
#             Kalles Leitung; kein eigener Ausgang, skripte/welt_3.gd)

